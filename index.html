<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #chatbox {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      overflow-y: scroll;
      padding: 10px;
    }
    .message {
      margin: 5px 0;
    }
    .user {
      text-align: right;
      color: blue;
    }
    .bot {
      text-align: left;
      color: green;
    }
  </style>
</head>
<body>
  <h1>AI Chatbox</h1>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." style="width: 80%;">
  <button id="sendBtn">Send</button>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // ✨ Updated function with cloud badges
    function appendMessage(content, className) {
      const message = document.createElement("div");
      message.className = `message ${className}`;

      const lines = content.split("\n");
      const lastLine = lines[lines.length - 1];

      let badgeHTML = "";
      if (lastLine.includes("Public Cloud")) {
        badgeHTML = `<span style="background-color: #d4f4dd; color: green; padding: 2px 6px; border-radius: 6px; font-size: 12px;">☁️ Public Cloud</span>`;
        lines.pop();
      } else if (lastLine.includes("Private Cloud")) {
        badgeHTML = `<span style="background-color: #ffd6d6; color: red; padding: 2px 6px; border-radius: 6px; font-size: 12px;">🔒 Private Cloud</span>`;
        lines.pop();
      }

      const baseText = lines.join("<br>");
      message.innerHTML = `${baseText}<br>${badgeHTML}`;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    // Handle button click
    sendBtn.addEventListener("click", async () => {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      userInput.value = "";

      try {
        const response = await fetch("https://aichatbox-74rq.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        appendMessage(data.response, "bot");
      } catch (error) {
        appendMessage("Error: Unable to fetch response.", "bot");
      }
    });
  </script>
</body>
</html>
