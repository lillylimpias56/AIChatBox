<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #chatbox {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      overflow-y: scroll;
      padding: 10px;
    }
    .message {
      margin: 5px 0;
    }
    .user {
      text-align: right;
      color: blue;
    }
    .bot {
      text-align: left;
      color: green;
    }
  </style>
</head>
<body>
  <h1>AI Chatbox</h1>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Type your message..." style="width: 80%;">
  <button id="sendBtn">Send</button>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Function to append messages to the chatbox
    function appendMessage(content, className) {
      const message = document.createElement("div");
      message.className = `message ${className}`;
      message.textContent = content;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight; // Auto-scroll to the bottom
    }

    // Handle button click
    sendBtn.addEventListener("click", async () => {
      const message = userInput.value.trim();
      if (!message) return;

      // Show user message
      appendMessage(message, "user");

      // Clear input
      userInput.value = "";

      try {
        // Send message to the backend
        const response = await fetch("https://aichatbox-74rq.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();

        // Show AI response
        appendMessage(data.response, "bot");
      } catch (error) {
        appendMessage("Error: Unable to fetch response.", "bot");
      }
    });
  </script>
</body>
</html>
